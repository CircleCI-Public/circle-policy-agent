version: 2.1

orbs:
  snyk: snyk/snyk@1.7.0

executors:
  go:
    docker:
      - image: cimg/go:1.23.1
    environment:
      CGO_ENABLED: 0

jobs:
  lint:
    executor: go
    steps:
      - checkout
      - run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.60.3
      - run: golangci-lint run -c .golangci.yml
      - run:
          name: check go.mod
          command: go mod tidy -v && git diff --exit-code -- go.mod go.sum

  test:
    executor: go
    steps:
      - checkout
      - run: go install gotest.tools/gotestsum@v1.12.0
      - run: mkdir -p /tmp/test-results
      - run: CGO_ENABLED=1 gotestsum --junitfile="{{.RESULTS_DIR}}"/results.xml ./... -race -count=1
      - run:
          name: Generate coverage report
          command: |
            go test ./... -coverprofile=coverage.out
            go tool cover -html=coverage.out -o coverage.html
            mv coverage.html /tmp/test-results
      - store_artifacts:
          path: /tmp/test-results
      - store_test_results:
          path: /tmp/test-results

  publish:
    executor: go
    steps:
      - checkout
      - run:
          name: Install gh
          command: |
            curl -fsSL https://github.com/cli/cli/releases/download/v2.63.2/gh_2.63.2_linux_amd64.tar.gz | tar -xz -C /tmp
            sudo mv /tmp/gh_2.63.2_linux_amd64/bin/gh /usr/local/bin/gh
      - run:
          name: Create release
          command: gh release create "v0.0.$CIRCLE_BUILD_NUM" --generate-notes

workflows:
  main:
    jobs:
      - lint
      - test
      - publish:
          requires:
            - lint
            - test
          context:
            - devex-release
          filters:
            branches:
              only:
                - main
